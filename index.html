<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja Online</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* Ajustes finos de estilo */
    .hero-carousel img {
      max-height: 400px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 1. FAIXA DE AVISO NO TOPO -->
  <div class="bg-primary text-white text-center py-2 text-uppercase fw-bold small">
    Frete grátis para todo o Brasil nas compras acima de R$ 199,00!
  </div>

  <!-- 2. NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand fw-bold" href="#">MinhaLoja</a>

      <!-- Botão Hambúrguer para Celular -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Conteúdo do Menu -->
      <div class="collapse navbar-collapse mt-2 mt-lg-0" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Início</a>
          </li>
          <!-- Dropdown Categorias -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Categorias
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" href="#">Eletrônicos</a></li>
              <li><a class="dropdown-item" href="#">Roupas</a></li>
              <li><a class="dropdown-item" href="#">Acessórios</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">Ver todas</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Ofertas</a>
          </li>
        </ul>

        <!-- Busca (em linha própria no celular) -->
        <form class="d-flex w-100 w-lg-auto me-lg-3 mb-2 mb-lg-0" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar produtos..." aria-label="Buscar">
          <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
        </form>

        <!-- Carrinho com Badge -->
        <div class="d-flex justify-content-end">
          <a href="#" class="btn btn-primary position-relative">
            <i class="bi bi-cart3"></i> Carrinho
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              3
            </span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- 3. CARROSSEL (3 SLIDES) -->
  <section class="hero-carousel mb-5">
    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://placehold.co/1200x400/007bff/ffffff?text=Grandes+Ofertas+de+Verão" class="d-block w-100" alt="Slide 1">
        </div>
        <div class="carousel-item">
          <img src="https://placehold.co/1200x400/28a745/ffffff?text=Lançamentos+Exclusivos" class="d-block w-100" alt="Slide 2">
        </div>
        <div class="carousel-item">
          <img src="https://placehold.co/1200x400/dc3545/ffffff?text=Até+50%+OFF+em+Eletrônicos" class="d-block w-100" alt="Slide 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Próximo</span>
      </button>
    </div>
  </section>
